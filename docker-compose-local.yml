# Local development infrastructure
# Only infrastructure services — APIs run locally in debug mode
#
# Usage:
#   docker compose -f docker-compose-local.yml up -d
#
# Main API: npm run start:debug (PORT=3000)
# User API: PORT=3001 npm run start:debug

services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    command: mongod --auth
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev-user
      MONGO_INITDB_ROOT_PASSWORD: dev-password
      MONGO_INITDB_DATABASE: 1driver
    volumes:
      - mongo-data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  valkey-data:
  minio-data:
